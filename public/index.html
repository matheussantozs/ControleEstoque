<!doctype html>
<html lang="pt-BR">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <meta name="theme-color" content="#09264a">
    <title>PDV Nexus — Controle de estoque</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <div id="toast" aria-live="polite" aria-atomic="true"></div>

    <section id="loginView" class="login-page">
        <div class="login-shell">
            <div class="login-brand"><span>PDV</span> NEXUS</div>
            <p class="login-subtitle">Controle de vendas, estoque e caixa</p>
            <form id="loginForm" class="login-form" novalidate>
                <label>Login<input id="login" name="login" autocomplete="username" required maxlength="60"></label>
                <label>Senha<input id="senha" name="senha" type="password" autocomplete="current-password" required maxlength="200"></label>
                <button class="primary login-submit" type="submit">Entrar</button>
            </form>
            <small class="login-note">Primeiro acesso: <strong>admin</strong> / <strong>admin123</strong></small>
        </div>
    </section>

    <section id="appView" class="app hidden">
        <aside class="sidebar">
            <div class="sidebar-brand"><span>PDV</span> NEXUS</div>
            <nav id="mainNav" aria-label="Navegação principal">
                <button data-page="caixa" class="nav-item active"><span class="nav-icon">▣</span> Caixa</button>
                <button data-page="dashboard" class="nav-item"><span class="nav-icon">◈</span> Visão geral</button>
                <button data-page="produtos" class="nav-item"><span class="nav-icon">▦</span> Produtos</button>
                <button data-page="movimentacoes" class="nav-item"><span class="nav-icon">↕</span> Movimentações</button>
                <button data-page="baixo" class="nav-item"><span class="nav-icon">!</span> Estoque baixo</button>
                <button data-page="relatorios" class="nav-item"><span class="nav-icon">▥</span> Relatórios</button>
                <button data-page="funcionarios" class="nav-item manager-only"><span class="nav-icon">♙</span> Funcionários</button>
                <button data-page="pagamentos" class="nav-item manager-only"><span class="nav-icon">▤</span> Formas de pagamento</button>
            </nav>
            <button id="logout" class="logout"><span>↪</span> Sair</button>
        </aside>

        <main class="main">
            <header class="topbar">
                <div>
                    <h1 id="pageTitle">Caixa</h1>
                    <p id="pageSubtitle">Registro de vendas</p>
                </div>
                <div class="operator-pill"><span class="operator-dot"></span><div><strong id="userName">—</strong><small id="userRole">—</small></div></div>
            </header>
            <div id="content"></div>
        </main>
    </section>

    <script src="/js/app.js"></script>
</body>
</html>
